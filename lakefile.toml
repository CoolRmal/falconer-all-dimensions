# Standalone extraction; Lean source files are unchanged from openai/math.
name = "falconer_all_dimensions"
version = "0.1.0"
defaultTargets = ["OAI"]

[leanOptions]
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[lean_lib]]
name = "OAI"
roots = ["OAI.MeasureTheory.Falconer.Campaign123PlanarFurstenbergProof"]
globs = ["OAI.+"]

[[lean_lib]]
name = "ComparatorChallenges"
roots = ["ComparatorChallenges.FalconerAllDimensions"]
globs = ["ComparatorChallenges.+"]
